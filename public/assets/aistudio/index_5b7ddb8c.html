<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park It! Car Parking Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9e6df;--fg:#22262d;--mut:#6b6f76;--asph:#4a4f58;--line:#f0c419;--frame:#2e323a;--card:#fff;--btn:#22262d;--btnfg:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#eceae4;--mut:#9a9ea6;--asph:#3a3e46;--frame:#0c0e11;--card:#22262d;--btn:#eceae4;--btnfg:#15181d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--fg:#eceae4;--mut:#9a9ea6;--asph:#3a3e46;--frame:#0c0e11;--card:#22262d;--btn:#eceae4;--btnfg:#15181d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.4 Barlow,system-ui,sans-serif;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 12px 24px;-webkit-user-select:none;user-select:none}
header{width:min(92vw,440px);display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{font:700 40px/1 "Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.5px}
.stats{display:flex;gap:16px;font-size:15px;color:var(--mut);text-align:right}
.stats b{display:block;font:700 26px/1 "Barlow Condensed",Impact,sans-serif;color:var(--fg)}
.lvl{display:flex;align-items:center;gap:8px;width:min(92vw,440px);margin-bottom:10px;font-size:17px}
.lvl button{width:34px;height:34px;padding:0;font-size:20px}
.lvl span{flex:1;text-align:center;font:700 22px "Barlow Condensed",sans-serif}
.frame{background:var(--frame);padding:10px;border-radius:16px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.board{--w:min(92vw,440px);width:calc(var(--w) - 20px);height:calc(var(--w) - 20px);position:relative;background-color:var(--asph);
background-image:linear-gradient(var(--line) 0 0),linear-gradient(var(--line) 0 0);background-size:0 0;border-radius:6px}
.board::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:var(--c) var(--c)}
.exit{position:absolute;right:0;width:12px;background:var(--bg)}
.exitlbl{position:absolute;color:var(--mut);font:700 13px "Barlow Condensed",sans-serif;pointer-events:none;left:100%;margin-left:14px;white-space:nowrap}
.car{position:absolute;border-radius:11px;touch-action:none;cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3);transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1)}
.car.drag{cursor:grabbing;transition:none;z-index:5;box-shadow:0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.3)}
.car::before{content:"";position:absolute;background:rgba(20,24,30,.42);border-radius:7px}
.car.h::before{left:26%;right:22%;top:16%;bottom:16%}
.car.v::before{top:26%;bottom:22%;left:16%;right:16%}
.car::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff6c0;box-shadow:0 0 6px #ffe97a}
.car.h::after{right:5px;top:22%;box-shadow:0 calc(var(--c)*.34) 0 #fff6c0,0 0 6px #ffe97a}
.car.v::after{bottom:5px;left:22%;box-shadow:calc(var(--c)*.34) 0 0 #fff6c0,0 0 6px #ffe97a}
.car.hint{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.07)}}
.car.out{transition:left .7s cubic-bezier(.5,0,.9,.4)}
.car.enter{animation:drop .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--d)*60ms)}
@keyframes drop{from{transform:translateY(-140%) scale(.85);opacity:0}to{transform:none;opacity:1}}
.car.rev{animation:rev .28s}
@keyframes rev{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.puff{position:absolute;width:16px;height:16px;border-radius:50%;background:rgba(225,225,225,.75);pointer-events:none;z-index:4;animation:puff .85s ease-out forwards}
@keyframes puff{to{transform:translate(-36px,-12px) scale(2.4);opacity:0}}
.stats b{transform-origin:right center}
.stats b.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.4)}}
.exitlbl{animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
button{font:700 17px "Barlow Condensed",sans-serif;letter-spacing:.3px;background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.tip{margin-top:12px;color:var(--mut);font-size:14px;text-align:center;max-width:380px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20}
.modal.on{display:flex}
.sel{max-width:min(92vw,400px)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:52vh;overflow:auto;margin:10px 0 14px}
.grid button{padding:7px 0 4px;font-size:18px;line-height:1.1}
.grid button small{display:block;font:500 10px Barlow,sans-serif;color:var(--line);letter-spacing:1px;min-height:12px}
.grid button.cur{outline:3px solid var(--line);outline-offset:1px}
.card{background:var(--card);border-radius:18px;padding:26px 30px;text-align:center;min-width:260px}
.card h2{font:700 34px "Barlow Condensed",sans-serif;margin:0 0 4px}
.stars{font-size:38px;color:var(--line);letter-spacing:4px;margin:6px 0}
.modal.on .card{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.stars i{font-style:normal;display:inline-block;animation:star .55s both;animation-delay:calc(var(--n)*180ms + 250ms)}
.stars i.off{color:var(--mut)}
@keyframes star{from{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.5) rotate(12deg)}to{transform:none}}
.card p{margin:0 0 16px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.car,.car.out{transition:none}*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Park It!</h1>
  <div class="stats"><div><b id="mv">0</b>moves</div><div><b id="par">0</b>best</div></div>
</header>
<div class="lvl"><button id="prev" aria-label="Previous level">‹</button><span id="lv">Level 1</span><button id="next" aria-label="Next level">›</button></div>
<div class="frame"><div class="board" id="board"></div></div>
<div class="bar"><button id="undo">Undo</button><button id="reset">Restart</button><button id="hint">Hint</button><button id="snd">Sound on</button><button id="lvls">Levels</button></div>

<div class="modal" id="sel"><div class="card sel"><h2>Pick a level</h2><div class="grid" id="grid"></div><button id="closesel">Close</button></div></div>
<div class="modal" id="modal"><div class="card"><h2>Parked!</h2><div class="stars" id="stars"></div><p id="msg"></p><button id="go">Next level</button></div></div>

var stars={};try{stars=JSON.parse(localStorage.getItem('parkit-stars'))||{}}catch(e){}
function gen(L){

function genOld(L){
  var r=rng(L*7919+13),minMoves=Math.min(3+Math.floor(L*1.5),24),nCars=Math.min(6+Math.floor(L/2),12);

function layout(){
  cs=board.clientWidth/6;
  board.style.setProperty('--c',cs+'px');
  cars.forEach(function(c,i){place(i,pos[i])});
  var ex=board.querySelector('.exit');
  if(ex){ex.style.top=(2*cs+4)+'px';ex.style.height=(cs-8)+'px'}
  var lb=board.querySelector('.exitlbl');
  if(lb){lb.style.top=(2*cs+cs/2-8)+'px'}
}
function place(i,v){
  var c=cars[i],el=c.el;
  el.style.width=(c.h?c.len*cs:cs)-10+'px';
  el.style.height=(c.h?cs:c.len*cs)-10+'px';
  el.style.left=(c.h?v*cs:c.fx*cs)+5+'px';
  el.style.top=(c.h?c.fy*cs:v*cs)+5+'px';
}

function load(L){
  level=L;var res=gen(L);
  cars=res.cars;start=res.pos.slice();pos=res.pos.slice();best=res.par;hist=[];moves=0;done=false;
  board.innerHTML='<div class="exit"></div><span class="exitlbl">exit</span>';
  cars.forEach(function(c,i){
    var el=document.createElement('div');
    el.className='car '+(c.h?'h':'v');el.dataset.i=i;
    el.style.background=i===0?RED:'linear-gradient(180deg,'+COLORS[(i-1)%COLORS.length]+',color-mix(in srgb,'+COLORS[(i-1)%COLORS.length]+' 78%,#000))';
    el.classList.add('enter');el.style.setProperty('--d',i);el.addEventListener('animationend',function(){el.classList.remove('enter')});
    c.el=el;board.appendChild(el);
  });
  layout();ui();
}
function ui(){
  document.getElementById('mv').textContent=moves;
  document.getElementById('par').textContent=best;
  document.getElementById('lv').textContent='Level '+level+' of '+TOTAL;
  document.getElementById('prev').disabled=level<=1;
  document.getElementById('next').disabled=level>=unlocked;
  document.getElementById('undo').disabled=!hist.length||done;
}

board.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.car');if(!el||done)return;
  var i=+el.dataset.i,c=cars[i],g=occ(cars,pos,i),lo=pos[i],hi=pos[i];
  while(lo>0&&g[cell(c,lo-1)]===-1)lo--;
  while(hi+c.len<6&&g[cell(c,hi+c.len)]===-1)hi++;
  el.setPointerCapture(e.pointerId);el.classList.add('drag');ac();sfx('pick');
  drag={i:i,lo:lo,hi:hi,sx:e.clientX,sy:e.clientY,p0:pos[i],cur:pos[i],el:el};
});
board.addEventListener('pointermove',function(e){
  if(!drag)return;
  var c=cars[drag.i],d=(c.h?e.clientX-drag.sx:e.clientY-drag.sy)/cs;
  var raw=drag.p0+d,over=raw<drag.lo-.12||raw>drag.hi+.12;
  if(over&&!drag.hit){sfx('bump');drag.hit=true}else if(!over)drag.hit=false;
  drag.cur=Math.max(drag.lo,Math.min(drag.hi,raw));
  place(drag.i,drag.cur);
});
function endDrag(){
  if(!drag)return;
  var i=drag.i,snap=Math.round(drag.cur);
  drag.el.classList.remove('drag');
  if(snap!==drag.p0){hist.push(pos.slice());pos[i]=snap;moves++;bump();sfx('slide')}
  place(i,pos[i]);drag=null;ui();
  if(pos[0]===4)win();
}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',endDrag);

function bump(){var m=document.getElementById('mv');m.classList.remove('bump');void m.offsetWidth;m.classList.add('bump')}
function win(){
  done=true;ui();
  var el=cars[0].el;el.classList.add('rev');sfx('rev');
  for(var k=0;k<7;k++)(function(k){setTimeout(function(){
    var p=document.createElement('i');p.className='puff';
    p.style.left=(pos[0]*cs+k*4)+'px';p.style.top=(2*cs+cs*(.3+Math.random()*.4))+'px';
    board.appendChild(p);setTimeout(function(){p.remove()},900);
  },k*90)})(k);
  setTimeout(function(){el.classList.remove('rev');el.classList.add('out');el.style.left=(6*cs+30)+'px'},280);
  setTimeout(function(){
    var s=moves<=best?3:moves<=best+3?2:1;
    document.getElementById('stars').innerHTML=[0,1,2].map(function(n){return '<i class="'+(n<s?'':'off')+'" style="--n:'+n+'">'+(n<s?'★':'☆')+'</i>'}).join('');
    sfx('win');for(var n=0;n<s;n++)(function(n){setTimeout(function(){sfx('star',n)},250+n*180)})(n);
    document.getElementById('msg').textContent=moves+' moves. Best possible is '+best+'.';
    stars[level]=Math.max(stars[level]||0,s);try{localStorage.setItem('parkit-stars',JSON.stringify(stars))}catch(e){}
    document.querySelector('#modal h2').textContent=level>=TOTAL?'All '+TOTAL+' levels cleared!':'Parked!';
    document.getElementById('go').textContent=level>=TOTAL?'Play again':'Next level';
    if(level>=unlocked&&level<TOTAL){unlocked=level+1;try{localStorage.setItem('parkit-unlocked',unlocked)}catch(e){}}
    document.getElementById('modal').classList.add('on');ui();
  },1050);
}

document.getElementById('go').onclick=function(){document.getElementById('modal').classList.remove('on');load(level<TOTAL?level+1:1)};
document.getElementById('reset').onclick=function(){pos=start.slice();hist=[];moves=0;done=false;cars[0].el.classList.remove('out');layout();ui()};
document.getElementById('undo').onclick=function(){if(!hist.length||done)return;pos=hist.pop();moves++;layout();ui();sfx('undo')};
document.getElementById('hint').onclick=function(){
  if(done)return;
  var sol=solve(cars,pos,500000);
  if(sol&&sol.length){var el=cars[sol[0][0]].el;el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint');sfx('hint')}
};
document.getElementById('prev').onclick=function(){if(level>1)load(level-1)};
document.getElementById('next').onclick=function(){if(level<unlocked)load(level+1)};
var sel=document.getElementById('sel'),grid=document.getElementById('grid');
document.getElementById('lvls').onclick=function(){
  grid.innerHTML='';
  for(var n=1;n<=TOTAL;n++)(function(n){
    var b=document.createElement('button'),st=stars[n]||0;
    b.innerHTML=n+'<small>'+(st?'\u2605'.repeat(st)+'\u2606'.repeat(3-st):'')+'</small>';
    if(n>unlocked)b.disabled=true;if(n===level)b.className='cur';
    b.onclick=function(){sel.classList.remove('on');document.getElementById('modal').classList.remove('on');load(n)};
    grid.appendChild(b);
  })(n);
  sel.classList.add('on');
  var cur=grid.children[level-1];if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'center'});
};
document.getElementById('closesel').onclick=function(){sel.classList.remove('on')};
var sb=document.getElementById('snd');function sync(){sb.textContent=muted?'Sound off':'Sound on'}sync();
sb.onclick=function(){muted=!muted;try{localStorage.setItem('parkit-mute',muted?'1':'0')}catch(e){}sync();if(!muted){ac();sfx('pick')}};
window.addEventListener('resize',layout);
load(level);
})();
</script>
</body>
</html>
